name: Lint & Code Review

on:
  pull_request:
    branches:
      - development

# --- FEATURE FLAGS ---
# Set any of these to "false" to disable that linter for this repo.
env:
  ENABLE_RUFF: "true"
  ENABLE_MYPY: "true"
  ENABLE_CLANG_FORMAT: "true"
  ENABLE_CPPCHECK: "true"
  ENABLE_MARKDOWNLINT: "true"

jobs:
  # Workflow-level env cannot be used in job-level `if` conditions, so this
  # job exposes the feature flags as outputs that downstream jobs can read.
  lint-config:
    name: Lint config
    runs-on: ubuntu-latest
    outputs:
      enable_ruff: ${{ steps.flags.outputs.enable_ruff }}
      enable_mypy: ${{ steps.flags.outputs.enable_mypy }}
      enable_clang_format: ${{ steps.flags.outputs.enable_clang_format }}
      enable_cppcheck: ${{ steps.flags.outputs.enable_cppcheck }}
      enable_markdownlint: ${{ steps.flags.outputs.enable_markdownlint }}
    steps:
      - id: flags
        run: |
          echo "enable_ruff=${{ env.ENABLE_RUFF }}" >> "$GITHUB_OUTPUT"
          echo "enable_mypy=${{ env.ENABLE_MYPY }}" >> "$GITHUB_OUTPUT"
          echo "enable_clang_format=${{ env.ENABLE_CLANG_FORMAT }}" >> "$GITHUB_OUTPUT"
          echo "enable_cppcheck=${{ env.ENABLE_CPPCHECK }}" >> "$GITHUB_OUTPUT"
          echo "enable_markdownlint=${{ env.ENABLE_MARKDOWNLINT }}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------
  # Python: Ruff (lint + format check)
  # -------------------------------------------------------
  lint-python-ruff:
    name: Ruff (Python lint + format)
    needs: lint-config
    runs-on: ubuntu-latest
    if: needs.lint-config.outputs.enable_ruff == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff lint (with inline PR annotations)
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  # -------------------------------------------------------
  # Python: mypy (static type checking)
  # -------------------------------------------------------
  lint-python-mypy:
    name: mypy (Python types)
    needs: lint-config
    runs-on: ubuntu-latest
    if: needs.lint-config.outputs.enable_mypy == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy
        run: pip install mypy

      - name: Install project dependencies (if requirements.txt exists)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run mypy
        run: |
          FILES=$(find . -name "*.py" -not -path "./.git/*" 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "No Python files found, skipping."
            exit 0
          fi
          mypy . --ignore-missing-imports --no-error-summary

  # -------------------------------------------------------
  # C/C++: clang-format (style enforcement)
  # -------------------------------------------------------
  lint-cpp-format:
    name: clang-format (C/C++ style)
    needs: lint-config
    runs-on: ubuntu-latest
    if: needs.lint-config.outputs.enable_clang_format == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check C/C++ formatting
        run: |
          FILES=$(find . -name "*.cpp" -o -name "*.cc" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "No C/C++ files found, skipping."
            exit 0
          fi
          echo "$FILES" | xargs clang-format --dry-run --Werror

  # -------------------------------------------------------
  # C/C++: cppcheck (static analysis)
  # -------------------------------------------------------
  lint-cpp-cppcheck:
    name: cppcheck (C/C++ analysis)
    needs: lint-config
    runs-on: ubuntu-latest
    if: needs.lint-config.outputs.enable_cppcheck == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          FILES=$(find . \( -name "*.cpp" -o -name "*.cc" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" \) -not -path "./.git/*" 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "No C/C++ files found, skipping."
            exit 0
          fi
          SUPPRESS=""
          if [ -f .cppcheck-suppressions ]; then
            SUPPRESS="--suppressions-list=.cppcheck-suppressions"
          fi
          echo "$FILES" | xargs cppcheck \
            --error-exitcode=1 \
            --enable=warning,style,performance \
            --inline-suppr \
            $SUPPRESS

  # -------------------------------------------------------
  # Markdown: markdownlint
  # -------------------------------------------------------
  lint-markdown:
    name: markdownlint
    needs: lint-config
    runs-on: ubuntu-latest
    if: needs.lint-config.outputs.enable_markdownlint == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
          config: ".markdownlint.yml"
